name: Bug report
description: Report a problem with BreastSubtypeR.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Share what you can; only observed behavior is required.
        **Do not upload identifiable patient-level data**, including in code,
        logs or screenshots. Use synthetic or public example data instead.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include relevant error messages with identifying details removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: versions
    attributes:
      label: Package, R and Bioconductor versions
      description: |
        If available, use `packageVersion("BreastSubtypeR")`, `R.version.string`
        and `BiocManager::version()`. Unknown versions are OK.
      placeholder: |
        BreastSubtypeR version:
        R version:
        Bioconductor version:
    validations:
      required: false
  - type: dropdown
    id: channel
    attributes:
      label: Installation channel
      options:
        - Bioconductor release
        - Bioconductor devel
        - GitHub
        - Other
        - Unknown
    validations:
      required: false
  - type: input
    id: input-type
    attributes:
      label: Input type
      description: Describe the input format and preprocessing, if known.
      placeholder: Raw counts, log2 RNA-seq expression, processed arrays, or packaged example data
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible example or steps
      description: |
        Paste a small example using synthetic or public data, or describe the
        steps and settings (including Shiny steps). A complete reproducible
        example is not required; explain what you can share if one is unavailable.
        Include the source revision or installation command if known.
    validations:
      required: false
  - type: textarea
    id: session-info
    attributes:
      label: sessionInfo()
      description: Paste the output of sessionInfo(), if available. Remove identifying details and private paths.
      render: text
    validations:
      required: false
